<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Clocher contre Clocher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Rubik:wght@400;600;700&display=swap">
<style>
/* Layout: resource bar on top, battlefield canvas in the middle, command groups along the bottom (compact on phones) */
:root{
  --bg:#2a2f24; --bar:#1e221a; --line:#454c3a; --ink:#f3eedd; --muted:#b8b59c;
  --blue:#3f6fd8; --red:#d8463f; --gold:#f0c14a; --xp:#9ad45a;
  --display:"Alfa Slab One",Rockwell,Georgia,serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
[hidden]{display:none!important}
.top,.bottom{background:var(--bar);padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.top{border-bottom:2px solid #000;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.bottom{border-top:2px solid #000;padding-bottom:max(8px,env(safe-area-inset-bottom,0px));display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
h1{font:400 18px var(--display);margin:0;color:var(--gold)}
.res{display:flex;gap:16px;align-items:center;font-variant-numeric:tabular-nums;font-weight:700;flex-wrap:wrap}
.res span.l{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:600;margin-right:4px}
.gold{color:var(--gold)}
.xpbar{width:110px;height:10px;background:#000;border:1px solid var(--line);position:relative;display:inline-block;vertical-align:middle}
.xpbar i{position:absolute;inset:0;background:var(--xp);transform-origin:left}
.tier{margin-left:auto;font:400 15px var(--display);color:var(--ink);display:flex;gap:10px;align-items:center}
.tier small{font:600 12px var(--body);color:var(--muted)}
.back{font:600 12px var(--body);color:var(--ink);background:#000;padding:5px 9px;border-radius:5px;text-decoration:none}
#field{flex:1;min-height:0;position:relative}
canvas{display:block;width:100%;height:100%}
.grp{display:flex;flex-direction:column;gap:4px;min-width:0}
.grp .lbl{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:700}
.row{display:flex;gap:6px;flex-wrap:wrap}
.btn{background:#3a4130;border:2px solid #000;color:var(--ink);font:600 13px var(--body);padding:6px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:118px;box-shadow:2px 2px 0 #000;text-align:left;touch-action:manipulation}
.btn b{font-weight:700}
.btn small{color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
.btn:hover:not(:disabled){background:#4a5340}
.btn:active:not(:disabled){transform:translate(1px,1px);box-shadow:1px 1px 0 #000}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn kbd{font:600 10px var(--body);color:var(--muted)}
.btn.tur{background:#33394a}.btn.up{background:#3c4a2a}.btn.sp{background:#4a3226}
.btn.slot{background:#2c2f36;min-width:96px}
.btn.slot.full{background:#3d2f3a}
.btn.slot small{color:#ff9d8a}
.queue{display:flex;gap:4px;align-items:center;margin-left:auto;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;align-self:center}
.queue i{width:12px;height:12px;border:1px solid #000;background:#000;display:inline-block}
.queue i.on{background:var(--blue)}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(15,18,12,.65);overflow:auto;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--bar);border:2px solid #000;box-shadow:5px 5px 0 #000;padding:20px;max-width:580px;width:100%;display:flex;flex-direction:column;gap:10px}
.card h2{font:400 26px/1.1 var(--display);margin:0;color:var(--gold);text-wrap:balance}
.card p{margin:0;line-height:1.5;color:var(--muted);font-size:14px}
.ages{display:flex;flex-wrap:wrap;gap:6px;font-size:12px}
.ages span{border:1px solid var(--line);padding:2px 8px;color:var(--ink)}
.levels{display:flex;flex-direction:column;gap:6px}
.lvl{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;text-align:left;background:#2e3426;border:2px solid #000;color:var(--ink);padding:8px 10px;cursor:pointer;font:inherit;box-shadow:2px 2px 0 #000}
.lvl:hover:not(:disabled){background:#3a4130}
.lvl:disabled{opacity:.45;cursor:not-allowed}
.lvl:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.lvl .num{font:400 20px var(--display);color:var(--gold);text-align:center}
.lvl b{display:block;font-size:15px}
.lvl span{font-size:12px;color:var(--muted)}
.lvl em{font-style:normal;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--xp)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.big{flex:1;min-width:150px;font:400 16px var(--display);padding:10px;border:2px solid #000;cursor:pointer;box-shadow:3px 3px 0 #000;color:#1a1a10;background:var(--gold)}
.big.alt{background:#c9c3a8}
.big:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (max-width:760px),(pointer:coarse){
  h1{display:none}
  .btn{min-width:0;flex:1 1 0;padding:5px 6px;font-size:11px}
  .btn.slot{min-width:0}
  .btn kbd{display:none}
  .grp{flex:1 1 100%}
  .row{flex-wrap:nowrap}
  .bottom{gap:6px;padding-block:6px}
  .queue{margin-left:0}
  .xpbar{width:70px}
}
@media (max-height:500px) and (pointer:coarse){
  .bottom{flex-wrap:nowrap;overflow-x:auto}
  .grp{flex:0 0 auto}
  .btn,.btn.slot{min-width:92px;flex:0 0 auto}
  .top{padding-block:4px}
}
</style>
</head>
<body>
<div class="top">
  <h1>Clocher contre Clocher</h1>
  <div class="res">
    <div><span class="l">Écus</span><b class="gold" id="gold">0</b></div>
    <div><span class="l">Renommée</span><span class="xpbar"><i id="xpI"></i></span> <b id="xp">0</b></div>
  </div>
  <div class="tier"><span id="tier">Cavernes</span><small id="lvlName"></small><a class="back" href="/">← Jeux</a></div>
</div>
<div id="field">
  <canvas id="c"></canvas>
  <div class="overlay" id="ov"><div class="card" id="card"></div></div>
</div>
<div class="bottom">
  <div class="grp"><span class="lbl">Troupes</span><div class="row" id="units"></div></div>
  <div class="grp"><span class="lbl">Acheter une défense</span><div class="row" id="turrets"></div></div>
  <div class="grp"><span class="lbl">Clocher : appuie pour revendre</span><div class="row" id="slots"></div></div>
  <div class="grp"><span class="lbl">Village</span><div class="row">
    <button class="btn up" id="up" type="button"><b id="upName">Âge suivant</b><small id="upTxt"></small><kbd>A</kbd></button>
    <button class="btn sp" id="sp" type="button"><b id="spName">Tocsin</b><small id="spTxt"></small><kbd>T</kbd></button>
  </div></div>
  <div class="queue" id="queue">File</div>
</div>
<script>
(()=>{
// ================= règles =================
// Cinq âges. Chaque âge a 3 troupes (mêlée, distance, costaud) et 3 défenses (légère, de zone, lourde).
const AGES=[
  {n:'Cavernes',need:0,sp:'Pluie de cailloux',
    units:[['gourdin','Homme à gourdin'],['caillou','Lanceur de cailloux','#8a8178'],['sanglier','Sanglier dressé']],
    tur:[['fronde','Fronde','#8a8178'],['rocher','Rocher roulant','#6e665c'],['epieu','Lance-épieux','#a0703a']]},
  {n:'Moyen Âge',need:300,sp:'Pluie de tuiles',
    units:[['paysan','Paysan à fourche'],['pave','Lanceur de pavés','#8a8a8a'],['ane','Âne têtu']],
    tur:[['pierres','Lance-pierres','#8a8a8a'],['huile',"Chaudron d'huile",'#e0a030'],['arbalete','Arbalète de clocher','#6a4a2a']]},
  {n:'Belle Époque',need:1000,sp:'Averse de baguettes',
    units:[['boulanger','Boulanger'],['fromage','Lanceur de camembert','#f3e3a0'],['charrette','Charrette de foin']],
    tur:[['tromblon','Tromblon du garde','#444'],['soupe','Marmite de soupe','#e07a30'],['canon','Canon de la fanfare','#2a2a2a']]},
  {n:'Trente Glorieuses',need:2600,sp:'Lâcher de choux',
    units:[['pompier','Pompier à la hache'],['choux','Catapulte à choux','#6fbf4a'],['tracteur','Tracteur']],
    tur:[['arroseur','Arroseur à jet','#5ab0f0'],['petard','Pétard du 14 juillet','#ff4a3a'],['grele','Canon à grêle','#cfe3ee']]},
  {n:'An 3000',need:5800,sp:'Pluie de croissants',
    units:[['robot','Robot-facteur'],['drone','Drone à baguettes','#5ff0ff'],['moissonneuse','Moissonneuse géante']],
    tur:[['laser','Laser de clocher','#5ff0ff'],['onde','Brouilleur à ondes','#c26bff'],['rayon','Rayon à fondue','#ffe05a']]}
];
const UBASE=[
  {cost:15,hp:60,dmg:9,range:24,rate:1.0,speed:44,reward:20,xp:10,train:1.0},
  {cost:25,hp:40,dmg:8,range:150,rate:1.3,speed:40,reward:32,xp:14,train:1.4,ranged:1},
  {cost:95,hp:260,dmg:20,range:30,rate:1.4,speed:30,reward:90,xp:36,train:2.8}];
const TBASE=[{cost:70,dmg:9,range:280,rate:.9},{cost:180,dmg:20,range:170,rate:2.0,splash:55},{cost:380,dmg:55,range:340,rate:2.3}];
const MUL=a=>Math.pow(1.75,a);
const UNITS=AGES.map((A,a)=>A.units.map(([id,n,proj],i)=>{const b=UBASE[i],m=MUL(a);return{id,n,proj,age:a,cost:Math.round(b.cost*m),hp:Math.round(b.hp*m),dmg:Math.round(b.dmg*m),
  range:b.ranged?b.range+15*a:b.range+(i===2?a*2:0),rate:b.rate,speed:b.speed+a*1.5,reward:Math.round(b.reward*m),xp:Math.round(b.xp*m),train:+(b.train+a*.15).toFixed(2)}}));
const TURRETS=AGES.map((A,a)=>A.tur.map(([id,n,col],i)=>{const b=TBASE[i],m=MUL(a);return{id,n,col,age:a,kind:i,cost:Math.round(b.cost*m),dmg:Math.round(b.dmg*m),range:b.range+a*10,rate:b.rate,splash:b.splash||0}}));
const SELL=.6;
const LEVELS=[
  {n:'Saint-Glinglin',d:"Le village d'à côté, encore à l'âge des cavernes. Des gourdins et beaucoup de bonne volonté.",inc:1.3,hp:1200,tier:0,xp:0,tur:[],ai:2.6,spN:7,maxT:1},
  {n:'Trifouilly-les-Oies',d:"Ils recrutent vite et une fronde garde le clocher.",inc:1.9,hp:1500,tier:0,xp:150,tur:[[0,0]],ai:2.1,spN:5,maxT:2},
  {n:'Pétaouchnok',d:"Déjà au Moyen Âge, avec un lance-pierres et un chaudron d'huile.",inc:2.4,hp:1900,tier:1,xp:350,tur:[[1,0],[1,1]],ai:1.8,spN:5,maxT:2},
  {n:'Perpète-les-Bains',d:"Un bourg de la Belle Époque, riche et bien défendu.",inc:2.9,hp:2500,tier:2,xp:1100,tur:[[2,0],[1,1]],ai:1.5,spN:4,maxT:3},
  {n:'Trou-Perdu',d:"Perdu au fond de la vallée, mais avec trois défenses dernier cri.",inc:3.4,hp:3200,tier:2,xp:1800,tur:[[2,0],[2,1],[2,2]],ai:1.3,spN:4,maxT:3},
  {n:'Clochemerle-le-Grand',d:"Le plus haut clocher du canton. Ils sont déjà aux Trente Glorieuses.",inc:4.0,hp:4200,tier:3,xp:2700,tur:[[3,1],[3,2],[2,0]],ai:1.1,spN:3,maxT:3}
];
const FW=1000,FH=430,GY=360,BASEX=[70,930],MYHP=1500,AGEHP=600,SLOTY=[-58,-98,-138];
const COL=['#3f6fd8','#d8463f'];

let progress=0;try{progress=Math.max(0,Math.min(LEVELS.length-1,+localStorage.getItem('cc-prog')||0))}catch(e){}

// ================= canevas =================
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),field=document.getElementById('field');
let W,H,dpr,k,oy;
function resize(){dpr=Math.min(2,devicePixelRatio||1);const r=field.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;k=Math.min(W/FW,H/FH);oy=Math.max(0,H-FH*k)}
addEventListener('resize',resize);resize();
try{new ResizeObserver(resize).observe(field)}catch(e){}

// ================= partie =================
let S=null,running=false,lvl=0;
function side(hp){return{gold:80,xp:0,tier:0,hp,maxhp:hp,queue:[],trainT:0,spCd:0,tur:[null,null,null]}}
function newGame(i){
  lvl=i;const L=LEVELS[i];
  S={t:0,s:[side(MYHP),side(L.hp)],units:[],proj:[],fx:[],ai:{t:2},over:false};
  const e=S.s[1];e.tier=L.tier;e.xp=L.xp;e.gold=80;L.tur.forEach(([a,kd],j)=>e.tur[j]={d:TURRETS[a][kd],cd:1});
  running=true;document.getElementById('ov').hidden=true;document.getElementById('lvlName').textContent=`Niveau ${i+1} · ${L.n}`;
  buildButtons();ui();floatTxt(500,150,`En route pour ${L.n} !`,'#f0c14a');
}
function income(si){return si===0?2.2*(1+.6*S.s[0].tier):LEVELS[lvl].inc*(1+.6*S.s[1].tier)}
function recruit(si,i){const sd=S.s[si],u=UNITS[sd.tier][i];if(!u||sd.gold<u.cost||sd.queue.length>=5)return false;sd.gold-=u.cost;sd.queue.push(u);if(sd.queue.length===1)sd.trainT=u.train;return true}
function upgrade(si){const sd=S.s[si],nx=AGES[sd.tier+1];if(!nx||sd.xp<nx.need)return false;sd.tier++;sd.maxhp+=AGEHP;sd.hp+=AGEHP;
  if(si===0){buildButtons();floatTxt(BASEX[0]+150,GY-200,`Ton village entre dans l'âge : ${nx.n} !`,'#9ad45a')}else floatTxt(BASEX[1]-150,GY-200,`Ils passent à l'âge : ${nx.n}`,'#e8774a');return true}
function freeSlot(sd){return sd.tur.findIndex(t=>!t)}
function buyTurret(si,i){const sd=S.s[si],d=TURRETS[sd.tier][i],slot=freeSlot(sd);if(!d||slot<0||sd.gold<d.cost)return false;
  sd.gold-=d.cost;sd.tur[slot]={d,cd:.5};if(si===0){floatTxt(BASEX[0]+70,GY+SLOTY[slot]-20,`${d.n} installé`,'#a9c4ff');buildSlots()}return true}
function sellTurret(si,slot){const sd=S.s[si],t=sd.tur[slot];if(!t)return false;const back=Math.floor(t.d.cost*SELL);sd.gold+=back;sd.tur[slot]=null;
  if(si===0){floatTxt(BASEX[0]+70,GY+SLOTY[slot]-20,`Revendu +${back}`,'#f0c14a');buildSlots()}return true}
function special(si){const sd=S.s[si];if(sd.spCd>0)return false;sd.spCd=45;const dmg=Math.round(55*MUL(sd.tier));
  for(let i=0;i<26;i++)S.fx.push({kind:'rain',x:si===0?380+Math.random()*560:60+Math.random()*560,y:-40-Math.random()*300,vy:380+Math.random()*120,tier:sd.tier});
  setTimeout(()=>{if(!S||S.over)return;for(const u of S.units)if(u.side!==si)hurt(u,dmg,si)},800);
  floatTxt(si===0?650:350,110,AGES[sd.tier].sp+' !',si===0?'#f0c14a':'#e8774a');return true}

function spawn(si,u){S.units.push({...u,side:si,x:BASEX[si]+(si?-40:40),maxhp:u.hp,cd:Math.random()*.3,ph:Math.random()*6,hit:0})}
function hurt(u,d,by){if(u.hp<=0)return;u.hp-=d;u.hit=.15;if(u.hp<=0){const kk=S.s[by];kk.gold+=u.reward;kk.xp+=u.xp;if(by===0)floatTxt(u.x,GY-70,`+${u.reward}`,'#f0c14a')}}
function hitBase(si,d,by){S.s[si].hp-=d;S.s[by].xp+=d*.08}

// ================= IA =================
function aiStep(dt){const a=S.s[1],ai=S.ai,L=LEVELS[lvl];
  a.gold+=dt*income(1);ai.t-=dt;
  const nx=AGES[a.tier+1];if(nx&&a.xp>=nx.need)upgrade(1);
  if(a.spCd<=0&&S.units.filter(u=>u.side===0&&u.x>480).length>=L.spN)special(1);
  const used=a.tur.filter(Boolean).length;
  // l'IA revend une défense d'un âge dépassé quand elle peut s'offrir mieux
  if(used>=L.maxT||freeSlot(a)<0){const old=a.tur.findIndex(t=>t&&t.d.age<a.tier);if(old>=0&&a.gold>TURRETS[a.tier][0].cost*2)sellTurret(1,old)}
  if(a.tur.filter(Boolean).length<L.maxT&&freeSlot(a)>=0){for(let i=2;i>=0;i--){const d=TURRETS[a.tier][i];if(a.gold>d.cost*1.6){buyTurret(1,i);break}}}
  if(ai.t<=0){const opts=UNITS[a.tier],mine=S.units.filter(u=>u.side===0).length;
    let pick=Math.random()<.5?0:Math.random()<.65?1:2;if(mine>5&&Math.random()<.4)pick=2;
    for(let i=pick;i>=0;i--){if(a.gold>=opts[i].cost&&a.queue.length<4){recruit(1,i);break}}
    ai.t=L.ai+Math.random()*1.2}
}

// ================= simulation =================
function step(dt){
  if(!running||S.over)return;S.t+=dt;
  for(const si of [0,1]){const sd=S.s[si];if(si===0)sd.gold+=dt*income(0);if(sd.spCd>0)sd.spCd-=dt;
    if(sd.queue.length){sd.trainT-=dt;if(sd.trainT<=0){const blocked=S.units.some(u=>u.side===si&&Math.abs(u.x-(BASEX[si]+(si?-40:40)))<22);if(!blocked){spawn(si,sd.queue.shift());if(sd.queue.length)sd.trainT=sd.queue[0].train}}}
    sd.tur.forEach((t,i)=>{if(!t)return;t.cd-=dt;if(t.cd>0)return;let tgt=null,bd=1e9;
      for(const u of S.units){if(u.side===si||u.hp<=0)continue;const d=Math.abs(u.x-BASEX[si]);if(d<=t.d.range&&d<bd){bd=d;tgt=u}}
      if(tgt){t.cd=t.d.rate;t.fire=.15;const sx=BASEX[si]+(si?-34:34),sy=GY+SLOTY[i];
        S.proj.push({sx,sy,tx:tgt,t:0,dur:.3+bd/900,col:t.d.col,dmg:t.d.dmg,by:si,splash:t.d.splash,big:t.d.kind===2,arc:t.d.kind===1?20:t.d.age>=3?5:40,beam:t.d.age===4})}
      else t.cd=.2;
      if(t.fire>0)t.fire-=dt})}
  aiStep(dt);
  const L0=S.units.filter(u=>u.side===0),R0=S.units.filter(u=>u.side===1);
  for(const u of S.units){
    if(u.hp<=0)continue;u.ph+=dt*6;if(u.hit>0)u.hit-=dt;
    const dir=u.side===0?1:-1,foes=u.side===0?R0:L0,allies=u.side===0?L0:R0;
    let tgt=null,td=1e9;
    for(const f of foes){if(f.hp<=0)continue;const d=(f.x-u.x)*dir;if(d>=-10&&d<=u.range+12&&d<td){td=d;tgt=f}}
    const baseX=BASEX[1-u.side],bd=(baseX-u.x)*dir-30;
    u.cd-=dt;
    if(tgt||bd<=u.range){
      if(u.cd<=0){u.cd=u.rate;
        if(u.proj)S.proj.push({sx:u.x+dir*8,sy:u.id==='drone'?GY-62:GY-34,tx:tgt,bx:tgt?null:baseX,t:0,dur:.55,col:u.proj,dmg:u.dmg,by:u.side,big:u.id==='choux',arc:u.id==='drone'?10:60});
        else{if(tgt)hurt(tgt,u.dmg,u.side);else hitBase(1-u.side,u.dmg,u.side);u.swing=.2}}
    }else{
      let blocked=false;for(const a of allies){if(a===u||a.hp<=0)continue;const d=(a.x-u.x)*dir;if(d>0&&d<26){blocked=true;break}}
      if(!blocked)u.x+=dir*u.speed*dt;
    }
    if(u.swing>0)u.swing-=dt;
  }
  for(const p of S.proj){p.t+=dt/p.dur;if(p.t>=1&&!p.done){p.done=true;
    if(p.tx){const x=p.tx.x;if(p.splash){for(const u of S.units)if(u.side!==p.by&&u.hp>0&&Math.abs(u.x-x)<=p.splash)hurt(u,p.dmg,p.by);S.fx.push({kind:'boom',x,y:GY-10,l:.4,c:p.col})}
      else if(p.tx.hp>0)hurt(p.tx,p.dmg,p.by)}
    else hitBase(1-p.by,p.dmg,p.by)}}
  S.proj=S.proj.filter(p=>!p.done);
  for(const u of S.units)if(u.hp<=0&&u.dying===undefined)u.dying=.6;
